name: Build APK only

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: stable

      - name: Get dependencies
        working-directory: ./macless_haystack
        run: flutter pub get

      - name: Build APK
        working-directory: ./macless_haystack
        run: flutter build apk --release

      # Gradle's own outputFileName renaming (in android/app/build.gradle)
      # turned out not to work reliably with this AGP version — Google
      # changed/deprecated the old applicationVariants API in AGP 8.x, so
      # Flutter's default name (app-release.apk) was slipping through
      # unchanged. Renaming it here instead, in plain bash, reading the
      # version straight from pubspec.yaml — this doesn't depend on any
      # Gradle plugin API and just works.
      - name: Rename APK with version
        working-directory: ./macless_haystack
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AGFind-release-v${VERSION}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: AGFind-release
          path: ./macless_haystack/build/app/outputs/flutter-apk/*.apk
