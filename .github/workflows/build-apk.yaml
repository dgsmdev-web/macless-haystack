name: Build APK only

on: [push]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: stable

      - name: Get dependencies
        working-directory: ./macless_haystack
        run: flutter pub get

      - name: Build APK
        working-directory: ./macless_haystack
        run: flutter build apk --release

      # No more "Rename APK" step — it used to force the file back to a
      # fixed "AGFind-release.apk" name, which overwrote the versioned
      # name Gradle already produces on its own now (outputFileName in
      # android/app/build.gradle is set to
      # "AGFind-release-v${versionName}.apk"). Removing this step lets
      # that versioned name survive all the way to the download.

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: AGFind-release
          path: ./macless_haystack/build/app/outputs/flutter-apk/*.apk
