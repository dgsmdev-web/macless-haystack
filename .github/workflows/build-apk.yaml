name: Build APK only

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: stable

      - name: Get dependencies
        working-directory: ./macless_haystack
        run: flutter pub get

      # Automatically bumps the patch number (the third number, e.g.
      # 2.8.0 -> 2.8.1) in pubspec.yaml before every manual build, so
      # you never have to edit the version by hand — just press "Run
      # workflow" and the version moves forward on its own. The change
      # is committed straight back to the repo, so the next run starts
      # from the new number, not the old one.
      - name: Bump version number
        working-directory: ./macless_haystack
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          sed -i "s/^version: .*/version: ${NEW_VERSION}+1/" pubspec.yaml
          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV
          echo "Bumped version: ${CURRENT} -> ${NEW_VERSION}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add macless_haystack/pubspec.yaml
          git commit -m "Bump version to ${{ env.NEW_VERSION }} [skip ci]"
          git push

      - name: Build APK
        working-directory: ./macless_haystack
        run: flutter build apk --release

      # Gradle's own outputFileName renaming (in android/app/build.gradle)
      # turned out not to work reliably with this AGP version — Google
      # changed/deprecated the old applicationVariants API in AGP 8.x, so
      # Flutter's default name (app-release.apk) was slipping through
      # unchanged. Renaming it here instead, in plain bash, reading the
      # version straight from pubspec.yaml — this doesn't depend on any
      # Gradle plugin API and just works.
      - name: Rename APK with version
        working-directory: ./macless_haystack
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AGFind-release-v${VERSION}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: AGFind-release
          path: ./macless_haystack/build/app/outputs/flutter-apk/*.apk
