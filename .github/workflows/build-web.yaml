name: Build Web only

on:
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: stable

      - name: Get dependencies
        working-directory: ./macless_haystack
        run: flutter pub get

      - name: Build Web
        working-directory: ./macless_haystack
        run: flutter build web --release

      # Version read directly from pubspec.yaml — same reliable
      # bash-based approach used for the APK build, no dependency on
      # any Gradle/Flutter plugin API.
      - name: Zip web build with version
        working-directory: ./macless_haystack
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          cd build/web
          zip -r ../../../AGFind-web-v${VERSION}.zip .

      - name: Upload Web bundle
        uses: actions/upload-artifact@v6
        with:
          name: AGFind-web
          path: ./AGFind-web-v*.zip
